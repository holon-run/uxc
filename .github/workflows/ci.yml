name: CI

# Local deterministic checks and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      node: ${{ steps.filter.outputs.node }}
      run_rust_ci: ${{ steps.classify.outputs.run_rust_ci }}
      run_node_ci: ${{ steps.classify.outputs.run_node_ci }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
            node:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

      - name: Classify CI scope
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          run_rust_ci=false
          run_node_ci=false
          if [[ "${{ steps.filter.outputs.rust }}" == "true" ]]; then
            run_rust_ci=true
          fi
          if [[ "${{ steps.filter.outputs.node }}" == "true" ]]; then
            run_node_ci=true
          fi
          echo "run_rust_ci=${run_rust_ci}" >> "${GITHUB_OUTPUT}"
          echo "run_node_ci=${run_node_ci}" >> "${GITHUB_OUTPUT}"

  fast-path:
    name: Fast Path (docs-only)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_rust_ci != 'true' && needs.changes.outputs.run_node_ci != 'true'

    steps:
      - name: Skip heavy jobs
        run: echo "No Rust or Node changes detected; skipping heavy CI jobs."

  node-quality:
    name: Node Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_node_ci == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript package
        run: npm run build:ts

  node-test:
    name: Node Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_node_ci == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-node-tests

      - name: Install dependencies
        run: npm ci

      - name: Build uxc binary
        run: cargo build --bin uxc

      - name: Run Node tests
        run: UXC_BIN=$PWD/target/debug/uxc npm run test:ts

  rust-quality:
    name: Rust Quality (stable)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_rust_ci == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-quality-stable

      - name: Run clippy
        run: cargo clippy -- -D warnings -A non_camel_case_types -A unused_variables -A unused_imports -A dead_code -A clippy::upper_case_acronyms -A clippy::enum_variant_names -A clippy::vec_init_then_push -A clippy::type_complexity

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_rust_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-${{ matrix.rust }}

      - name: Run tests (stable)
        if: matrix.rust == 'stable'
        run: cargo test --verbose -- --test-threads=1

      - name: Run compatibility check (beta/nightly)
        if: matrix.rust != 'stable'
        run: cargo check --all-targets --all-features

  local-e2e:
    name: Local E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_rust_ci == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install grpcurl
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-local-e2e

      - name: Build uxc and test servers
        run: |
          cargo build --release --bin uxc
          cargo build --release --features test-server \
            --bin uxc-test-openapi-server \
            --bin uxc-test-graphql-server \
            --bin uxc-test-jsonrpc-server \
            --bin uxc-test-grpc-server \
            --bin uxc-test-mcp-http-server \
            --bin uxc-test-mcp-stdio-server

      - name: Run local E2E tests
        run: cargo test --test local_e2e_test --verbose -- --test-threads=1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_rust_ci == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-security

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2025-0134

  build-pr:
    name: Build (PR Linux)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_rust_ci == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-pr-linux

      - name: Build
        run: cargo build --release

  build-main:
    name: Build (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.run_rust_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-${{ runner.os }}-${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uxc-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/uxc*
